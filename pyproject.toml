[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tarmo-vuln-core"
version = "0.2.0"
description = "Shared vulnerability processing library for pentest-scribe and other downstream consumers"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Tarmo Technologies" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "pyhanko>=0.21",
    "pyhanko-certvalidator>=0.26",
    "rfc3161ng>=2.1",
    "cryptography>=42",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "httpx>=0.27"]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML",
    "types-defusedxml",
    "maturin>=1.7",
    "responses>=0.25",
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.40",
]

[tool.setuptools.package-data]
tarmo_vuln_core = ["finding_library/*.yaml", "cdata/mappings/*.json"]

[tool.maturin]
module-name = "vuln_core_rs"
manifest-path = "rust/Cargo.toml"
features = ["pyo3/extension-module"]
python-packages = ["tarmo_vuln_core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyhanko.*", "pyhanko_certvalidator.*", "rfc3161ng.*", "asn1crypto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tarmo_vuln_core.signing.pdf_signer"
# pyhanko functions are untyped; suppress no-untyped-call for this module
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tarmo_vuln_core.ingestors.parsers.*"
# Parsers copied from pentest-scribe use defusedxml.ElementTree which has
# imprecise stubs (getroot() returns Element | None).  Suppress union-attr
# and missing type-arg errors inherited from the upstream code.
disable_error_code = ["union-attr", "type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure-Python unit tests",
    "integration: tests requiring compiled Rust extension",
    "real_fixture: tests validating real-world scanner output",
    "regression: tests that must never fail — core functionality guards",
]

[tool.coverage.run]
source = ["tarmo_vuln_core"]

[tool.coverage.report]
fail_under = 80
