    - "Identify the endpoint that accepts XML input."
    - "Submit XML with an external entity: <!DOCTYPE foo [<!ENTITY xxe SYSTEM 'file:///etc/passwd'>]><root>&xxe;</root>"
    - "Observe whether file contents appear in the response."
    - "Test blind XXE with an out-of-band callback."
    - "Document the endpoint, payload, and data exfiltrated."

