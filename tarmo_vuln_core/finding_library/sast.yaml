- id: sql-injection-source
  title: "SQL Injection (Source Code)"
  severity: CRITICAL
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 89
  owasp_id: "A05:2025"
  attack_ids: ["T1190"]
  attack_tactics: ["Initial Access"]
  methodology_items: ["INPV-05"]
  aliases:
    nessus_plugin: []
    cve: []
    semgrep_rule:
      - "python.lang.security.audit.formatted-sql-query"
      - "python.django.security.injection.sql.sql-injection-using-raw"
      - "java.lang.security.audit.sqli.tainted-sql-from-http-request"
      - "javascript.lang.security.audit.detect-sql-injection"
    bandit_test: ["B608"]
    cwe: [89]
  description: |
    Static analysis identified code that constructs SQL queries using string
    concatenation or formatting with user-controlled input, creating a SQL
    injection vulnerability exploitable at runtime.
  impact: |
    An attacker can read sensitive data from the database (credentials,
    PII, financial data), modify or delete records, execute administrative
    operations, and in some configurations achieve OS-level command execution.
  remediation: |
    Use parameterized queries (prepared statements) for all database
    interactions. Apply an ORM that enforces safe query construction.
    Implement a web application firewall (WAF) as a defense-in-depth layer.
  references:
    - "https://owasp.org/www-community/attacks/SQL_Injection"
    - "https://cwe.mitre.org/data/definitions/89.html"
  compliance_refs:
    - "PCI-DSS 6.2.4"
    - "ISO27001 A.14.2.5"
  steps:
    - "Identify the endpoint that exercises the vulnerable code path from the source reference."
    - "Inject a single quote (') into the parameter and observe error messages or behaviour changes."
    - "Test with a time-based payload: ' OR SLEEP(5)-- to confirm blind injection."
    - "Use sqlmap: sqlmap -u '<url>' -p '<param>' --level=3 to enumerate tables and extract data."
    - "Document the vulnerable endpoint, parameter name, payload, and extracted proof-of-concept data."

