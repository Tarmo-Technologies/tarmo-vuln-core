      - "java.lang.security.audit.command-injection-formatted-runtime-call"
    bandit_test: ["B602", "B603", "B604"]
    cwe: [78]
  description: |
    Static analysis identified code that passes user-controlled input to OS
    command execution functions (subprocess, os.system, exec) without proper
