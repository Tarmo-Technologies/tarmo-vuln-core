    - "Inject a payload: ; id or | whoami into the parameter."
    - "Observe whether command output appears in the response or behaviour changes."
    - "Test time-based: ; sleep 5 to confirm blind command injection."
    - "Document the endpoint, parameter, payload, and command output."

