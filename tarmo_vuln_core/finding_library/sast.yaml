- id: buffer-overflow-source
  title: "Buffer Overflow (Source Code)"
  severity: CRITICAL
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 120
  owasp_id: "A06:2025"
  attack_ids: ["T1203"]
  attack_tactics: ["Execution"]
  aliases:
    nessus_plugin: []
    cve: []
    semgrep_rule:
      - "c.lang.security.insecure-use-gets-fn"
      - "c.lang.security.insecure-use-string-copy-fn"
    bandit_test: []
    cwe: [120]
  description: |
    Static analysis identified use of unsafe buffer operations (gets, strcpy,
    sprintf) that do not perform bounds checking, creating a buffer overflow
    vulnerability.
  impact: |
    An attacker can corrupt memory to achieve arbitrary code execution,
    crash the application (denial of service), or leak sensitive data
    from adjacent memory.
  remediation: |
    Replace unsafe functions with bounds-checked alternatives: fgets instead
    of gets, strncpy/strlcpy instead of strcpy, snprintf instead of sprintf.
    Enable compiler protections: -fstack-protector, ASLR, DEP/NX.
  references:
    - "https://cwe.mitre.org/data/definitions/120.html"
  compliance_refs:
    - "PCI-DSS 6.2.4"
  steps:
    - "Identify the network service or input vector that reaches the vulnerable function."
    - "Craft an input exceeding the buffer size and observe application crash."
    - "Use gdb to analyse the crash and confirm instruction pointer control."
    - "Develop a proof-of-concept exploit demonstrating code execution."
    - "Document the input vector, buffer size, crash analysis, and PoC."

