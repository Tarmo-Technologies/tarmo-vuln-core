      - "python.lang.security.audit.insecure-xml-use"
      - "java.lang.security.audit.xxe"
    bandit_test: ["B314", "B320"]
    cwe: [611]
  description: |
    Static analysis identified XML parsing code that does not disable external
    entity resolution, making it vulnerable to XXE attacks.
  impact: |
    An attacker can read local files on the server, perform SSRF to internal
    services, and in some cases achieve denial of service or remote code
