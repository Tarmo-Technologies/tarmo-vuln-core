- id: s3-public-bucket
  title: "Publicly Accessible S3 Bucket"
  severity: HIGH
  cvss_score: 8.8
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 284
  owasp_id: "A01:2025"
  aliases:
    nessus_plugin: []
    cve: []
  description: |
    An Amazon S3 bucket is configured with public read or write access,
    allowing unauthenticated users to list, download, or upload objects.
    Public bucket access is frequently a misconfiguration resulting from
    disabled S3 Block Public Access settings or overly permissive bucket policies.
  impact: |
    Publicly readable buckets expose sensitive files including credentials,
    PII, application configuration, backups, and proprietary data to any
    internet user. Publicly writable buckets allow content injection,
    malware hosting, and data tampering.
  remediation: |
    Enable S3 Block Public Access at the account and bucket level. Review
    and remove any bucket policies or ACLs that grant s3:GetObject to
    Principal: '*'. Use S3 Access Analyzer to continuously monitor for
    public access configuration. Enforce private-only bucket configuration
    via AWS Service Control Policies (SCPs) in the organization.
  references:
    - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"
    - "https://cwe.mitre.org/data/definitions/284.html"
  steps:
    - "Enumerate buckets: aws s3 ls or use bucket finder tools (GrayhatWarfare, S3Scanner)."
    - "Test public access: aws s3 ls s3://<bucket-name> --no-sign-request"
    - "Attempt download: aws s3 cp s3://<bucket-name>/<key> /tmp/test --no-sign-request"
    - "Test write access: aws s3 cp /tmp/test.txt s3://<bucket-name>/ --no-sign-request"
    - "Document the bucket name, accessible objects, and their sensitivity."

- id: overly-permissive-iam
  title: "Overly Permissive IAM Policy"
  severity: HIGH
  cvss_score: 8.6
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 272
  owasp_id: "A01:2025"
  aliases:
    nessus_plugin: []
    cve: []
  description: |
    IAM users, roles, or groups are granted excessive permissions beyond
    what is required for their function (violation of the principle of
    least privilege). Common misconfigurations include wildcard actions
    (Action: '*'), wildcard resources (Resource: '*'), or AttachUserPolicy
    permissions that enable privilege escalation.
  impact: |
    A compromised IAM credential with excessive permissions allows an
    attacker to escalate to administrator-level access, access all resources
    across the AWS account, exfiltrate data, deploy backdoors, and incur
    significant financial charges via resource abuse.
  remediation: |
    Apply the principle of least privilege to all IAM identities. Replace
    wildcard actions and resources with specific, required permissions.
    Use IAM Access Analyzer and AWS Trusted Advisor to identify and remediate
    overly permissive policies. Enforce Permission Boundaries on all roles.
    Enable AWS CloudTrail for IAM API logging and anomaly detection.
  references:
    - "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"
    - "https://cwe.mitre.org/data/definitions/272.html"
  steps:
    - "Enumerate attached policies: aws iam list-attached-user-policies --user-name <user>"
    - "Review policy documents: aws iam get-policy-version --policy-arn <arn> --version-id v1"
    - "Search for wildcards: Action: '*' or Resource: '*' in policy documents."
    - "Use Pacu or Principal Mapper to identify privilege escalation paths."
    - "Document overly permissive policies, affected principals, and escalation paths."

- id: security-group-unrestricted
  title: "Security Group Allows Unrestricted Inbound Access"
  severity: CRITICAL
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 284
  owasp_id: "A02:2025"
  aliases:
    nessus_plugin: []
    cve: []
  description: |
    An EC2 Security Group or VPC firewall rule is configured to allow
    unrestricted inbound access (0.0.0.0/0 or ::/0) to sensitive ports
    such as SSH (22), RDP (3389), database ports (3306, 5432, 1433),
    or all ports (0-65535).
  impact: |
    Sensitive services are exposed to the entire internet, enabling
    brute-force attacks, exploitation of unpatched vulnerabilities,
    and direct access to databases or management interfaces. This is
    a critical misconfiguration that dramatically increases attack surface.
  remediation: |
    Restrict all inbound security group rules to specific, necessary CIDR
    ranges. Replace 0.0.0.0/0 with specific known-good IP addresses for
    management ports (SSH, RDP). Use AWS Systems Manager Session Manager
    instead of SSH/RDP for instance management. Enable AWS Config rules to
    detect and alert on permissive security group changes.
  references:
    - "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html"
    - "https://cwe.mitre.org/data/definitions/284.html"
  steps:
    - "Enumerate security groups: aws ec2 describe-security-groups --query 'SecurityGroups[*].[GroupId,IpPermissions]'"
    - "Identify rules with CidrIp: 0.0.0.0/0 on sensitive ports (22, 3389, 3306, 5432, 1433)."
    - "Confirm the exposed port is reachable: nmap -p 22,3389 <public-ip>"
    - "Document the security group ID, rule, affected instances, and exposed service."

- id: imdsv1-enabled
  title: "EC2 Instance Metadata Service v1 (IMDSv1) Enabled"
  severity: MEDIUM
  cvss_score: 6.0
  cvss_vector: "CVSS:4.0/AV:N/AC:H/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 918
  owasp_id: "A02:2025"
  methodology_items: ["INPV-19"]
  aliases:
    nessus_plugin: []
    cve: []
  description: |
    EC2 instances are configured to allow Instance Metadata Service version 1
    (IMDSv1), which does not require session authentication. If an SSRF
    vulnerability exists in the application, an attacker can retrieve IAM
    role credentials from the metadata endpoint at 169.254.169.254 without
    any token.
  impact: |
    Combined with an SSRF vulnerability, IMDSv1 allows an attacker to
    retrieve the EC2 instance's IAM role credentials (access key, secret key,
    session token) from the metadata endpoint. These credentials can be used
    to access AWS resources with the instance's IAM role permissions.
  remediation: |
    Require IMDSv2 on all EC2 instances using instance metadata options:
    aws ec2 modify-instance-metadata-options --instance-id <id>
    --http-tokens required --http-endpoint enabled
    Enforce IMDSv2 organization-wide via SCP and AWS Config rules.
  references:
    - "https://aws.amazon.com/blogs/security/defense-in-depth-open-firewalls-reverse-proxies-ssrf-vulnerabilities-ec2-instance-metadata-service/"
    - "https://cwe.mitre.org/data/definitions/918.html"
  steps:
    - "From the EC2 instance or via SSRF, query: curl http://169.254.169.254/latest/meta-data/"
    - "If successful without a PUT token, IMDSv1 is enabled."
    - "Retrieve credentials: curl http://169.254.169.254/latest/meta-data/iam/security-credentials/<role-name>"
    - "Validate credentials: aws sts get-caller-identity"
    - "Document the metadata response, retrieved credentials (redacted), and role permissions."

- id: unencrypted-storage
  title: "Unencrypted Cloud Storage or Database"
  severity: HIGH
  cvss_score: 8.2
  cvss_vector: "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 311
  owasp_id: "A04:2025"
  methodology_items: ["CRYP-03"]
  aliases:
    nessus_plugin: []
    cve: []
  description: |
    Cloud storage resources (S3 buckets, EBS volumes, RDS databases,
    DynamoDB tables) are not encrypted at rest. If the underlying storage
    is accessed directly (e.g., via a compromised AWS account or physical
    access), data is readable without decryption.
  impact: |
    Unencrypted storage means that any party who gains access to the
    underlying storage media — via a compromised cloud account, insider
    threat, or cloud provider incident — can read all stored data without
    needing application-level access. This violates GDPR, HIPAA, and PCI-DSS
    compliance requirements.
  remediation: |
    Enable server-side encryption on all S3 buckets (SSE-S3 or SSE-KMS).
    Enable encryption at rest for all RDS instances, EBS volumes, DynamoDB
    tables, and ElastiCache clusters. Use AWS KMS for key management.
    Enforce encryption via AWS Config rules and SCPs.
  references:
    - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html"
    - "https://cwe.mitre.org/data/definitions/311.html"
  steps:
    - "Check S3 bucket encryption: aws s3api get-bucket-encryption --bucket <name>"
    - "Check RDS encryption: aws rds describe-db-instances --query 'DBInstances[*].[DBInstanceIdentifier,StorageEncrypted]'"
    - "Check EBS volumes: aws ec2 describe-volumes --query 'Volumes[*].[VolumeId,Encrypted]'"
    - "Document all unencrypted resources, their type, and the data classification of stored content."

- id: cloudtrail-disabled
  title: "AWS CloudTrail Logging Disabled"
  severity: MEDIUM
  cvss_score: 5.1
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:L/VI:L/VA:N/SC:L/SI:L/SA:N"
  cvss_version: "4.0"
  cwe_id: 778
  owasp_id: "A09:2025"
  aliases:
    nessus_plugin: []
    cve: []
  description: |
    AWS CloudTrail is not enabled in one or more regions, or multi-region
    trails are not configured. CloudTrail records API activity across AWS
    services. Without it, security incidents cannot be investigated and
    malicious activity cannot be detected or attributed.
  impact: |
    Without CloudTrail, an attacker who compromises AWS credentials can
    operate without leaving an audit trail, making incident response,
    forensics, and breach notification impossible. Regulatory compliance
    requirements (SOC 2, PCI-DSS, HIPAA, ISO 27001) require audit logging.
  remediation: |
    Enable a multi-region CloudTrail trail covering all AWS services and
    all regions. Enable CloudTrail log file integrity validation. Deliver
    logs to a separate, locked-down S3 bucket and forward to a SIEM.
    Enable AWS Config and Security Hub to detect CloudTrail configuration
    gaps. Set CloudWatch alarms for unauthorized API calls and root account usage.
  references:
    - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-best-practices.html"
    - "https://cwe.mitre.org/data/definitions/778.html"
  steps:
    - "Check trail status: aws cloudtrail describe-trails --include-shadow-trails"
    - "Verify logging status: aws cloudtrail get-trail-status --name <trail-name>"
    - "Check region coverage: aws cloudtrail describe-trails --include-shadow-trails --query 'trailList[*].[Name,IsMultiRegionTrail,HomeRegion]'"
    - "Confirm the S3 bucket for log delivery exists and is accessible."
    - "Document gaps: disabled trails, regions without coverage, or missing log integrity validation."

- id: secrets-in-env-variables
  title: "Secrets Exposed in Environment Variables"
  severity: HIGH
  cvss_score: 7.1
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 200
  owasp_id: "A04:2025"
  aliases:
    nessus_plugin: []
    cve: []
  description: |
    Sensitive values including database passwords, API keys, cryptographic
    secrets, and cloud credentials are stored as plaintext environment
    variables in container definitions, Lambda function configurations,
    EC2 user data, or application deployments. These values are visible
    to any party with IAM permissions to read the configuration.
  impact: |
    An attacker with access to the cloud environment (or the application
    server) can retrieve all plaintext secrets from environment variables
    without additional exploitation. Secrets may also appear in CloudTrail
    logs, ECS task definitions, and container registries.
  remediation: |
    Store all secrets in AWS Secrets Manager or AWS Systems Manager
    Parameter Store (SecureString type). Inject secrets into applications
    at runtime via the SDK, not as environment variables. Rotate all
    secrets that have been stored as environment variables. Use IAM
    policies to restrict access to Secrets Manager entries.
  references:
    - "https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"
    - "https://cwe.mitre.org/data/definitions/200.html"
    - "https://12factor.net/config"
  steps:
    - "Retrieve ECS task definition: aws ecs describe-task-definition --task-definition <name>"
    - "Check environment section for secret values: look for DB_PASSWORD, API_KEY, SECRET_KEY patterns."
    - "Check Lambda config: aws lambda get-function-configuration --function-name <name>"
    - "Check EC2 user data: aws ec2 describe-instance-attribute --attribute userData --instance-id <id>"
    - "Document each discovered secret (redacted), its location, and the access it grants."

- id: container-running-as-root
  title: "Container Running as Root"
  severity: CRITICAL
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H"
  cvss_version: "4.0"
  cwe_id: 250
  aliases:
    nessus_plugin: []
    cve: []
  description: |
    Container workloads are running as the root user (UID 0) inside the
    container. If the container is compromised or a container escape
    vulnerability exists, root access inside the container maps directly
    to root access on the host, significantly expanding the blast radius.
  impact: |
    If a container escape vulnerability (e.g., runc CVE-2019-5736) exists,
    an attacker with root access in the container can escalate to full
    host compromise. Root containers also violate the principle of least
    privilege and fail common compliance frameworks (CIS Kubernetes Benchmark,
    PCI-DSS, HIPAA).
  remediation: |
    Specify a non-root user in the Dockerfile using the USER instruction.
    Set securityContext.runAsNonRoot: true and securityContext.runAsUser:
    <non-zero-UID> in Kubernetes pod specifications. Use read-only root
    filesystems. Enable admission controllers (OPA/Gatekeeper, Kyverno)
    to enforce non-root policies across the cluster.
  references:
    - "https://docs.docker.com/develop/develop-images/dockerfile_best-practices/#user"
    - "https://cwe.mitre.org/data/definitions/250.html"
    - "https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html"
  steps:
    - "Inspect running containers: docker inspect <container> | grep -i user"
    - "Execute inside the container: docker exec <container> id"
    - "Check Kubernetes pod spec: kubectl get pod <pod> -o yaml | grep -A5 securityContext"
    - "Confirm UID 0 (root) is the running user."
    - "Document the container name, image, running user, and workload risk classification."
