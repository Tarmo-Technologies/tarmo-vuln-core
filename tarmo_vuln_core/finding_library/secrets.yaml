- id: hardcoded-api-key
  title: "Hardcoded API Key"
  severity: HIGH
  cvss_score: 8.2
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 798
  owasp_id: "A07:2025"
  attack_ids: ["T1552.001"]
  attack_tactics: ["Credential Access"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: ["generic-api-key", "aws-access-key-id", "gcp-api-key", "stripe-api-key"]
    trufflehog_detector: ["AWS", "GCP", "Stripe", "GenericApiKey"]
    bandit_test: []
    cwe: [798]
  description: |
    A hardcoded API key was found in source code or configuration files.
    API keys provide authenticated access to external services and should
    never be committed to version control.
  impact: |
    An attacker can use the discovered API key to access the corresponding
    service with the key's permissions, potentially reading data, modifying
    resources, or incurring financial charges.
  remediation: |
    Rotate the exposed API key immediately. Store API keys in environment
    variables, a secrets manager (AWS Secrets Manager, HashiCorp Vault),
    or encrypted configuration. Add the file pattern to .gitignore.
  references:
    - "https://cwe.mitre.org/data/definitions/798.html"
    - "https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password"
  compliance_refs:
    - "PCI-DSS 6.2.4"
    - "ISO27001 A.9.2.4"
  steps:
    - "Extract the API key value from the source code reference."
    - "Identify the target service from the key format or surrounding context."
    - "Test the key: curl -H 'Authorization: Bearer <key>' <service-api-url>"
    - "Verify access level: enumerate resources accessible with this key."
    - "Document the key type, service, access level, and resources accessible."

- id: hardcoded-password
  title: "Hardcoded Password"
  severity: HIGH
  cvss_score: 8.2
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 798
  owasp_id: "A07:2025"
  attack_ids: ["T1552.001"]
  attack_tactics: ["Credential Access"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: ["password-in-url", "generic-password"]
    trufflehog_detector: ["URI", "GenericPassword"]
    bandit_test: ["B105", "B106", "B107"]
    cwe: [798]
  description: |
    A hardcoded password or credential was found in source code. This
    credential may grant access to databases, admin panels, or other
    protected resources.
  impact: |
    An attacker can use the discovered password to authenticate to the
    target system, potentially gaining admin access or accessing
    sensitive data.
  remediation: |
    Rotate the exposed password immediately. Replace hardcoded credentials
    with environment variables or a secrets manager. Implement credential
    rotation policies.
  references:
    - "https://cwe.mitre.org/data/definitions/798.html"
  compliance_refs:
    - "PCI-DSS 6.2.4"
    - "ISO27001 A.9.2.4"
  steps:
    - "Extract the username and password from the source code."
    - "Identify the target service (database, admin panel, API)."
    - "Attempt authentication with the discovered credentials."
    - "If successful, document the access level and data accessible."
    - "Check for credential reuse on other services."

- id: exposed-private-key
  title: "Exposed Private Key"
  severity: CRITICAL
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N"
  cvss_version: "4.0"
  cwe_id: 321
  owasp_id: "A02:2025"
  attack_ids: ["T1552.004"]
  attack_tactics: ["Credential Access"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: ["private-key"]
    trufflehog_detector: ["PrivateKey"]
    bandit_test: []
    cwe: [321]
  description: |
    A private key (RSA, EC, SSH, PGP) was found in source code or
    configuration files. Private keys are the most sensitive credential
    type and must never be stored in version control.
  impact: |
    An attacker can use the private key to impersonate the server in TLS
    connections, sign code or documents, decrypt encrypted communications,
    or authenticate via SSH to remote systems.
  remediation: |
    Revoke and regenerate the exposed key immediately. Store private keys
    in a hardware security module (HSM) or secrets manager. Use short-lived
    certificates where possible.
  references:
    - "https://cwe.mitre.org/data/definitions/321.html"
  compliance_refs:
    - "PCI-DSS 6.2.4"
    - "ISO27001 A.10.1.2"
  steps:
    - "Extract the private key from the source code reference."
    - "Identify the key type (RSA, EC, SSH, PGP) and its purpose."
    - "For SSH keys: attempt ssh -i <key> user@host against known hosts."
    - "For TLS keys: verify it matches a deployed certificate using openssl."
    - "Document the key type, associated system, and proof of validity."

- id: leaked-jwt-secret
  title: "Leaked JWT Signing Secret"
  severity: CRITICAL
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 345
  owasp_id: "A02:2025"
  attack_ids: ["T1134"]
  attack_tactics: ["Defense Evasion"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: ["jwt-secret", "jwt-token"]
    trufflehog_detector: ["JWT"]
    bandit_test: []
    cwe: [345]
  description: |
    The JWT signing secret was found in source code. Knowledge of this
    secret allows forging valid authentication tokens for any user.
  impact: |
    An attacker can forge JWT tokens with arbitrary claims, impersonating
    any user including administrators, bypassing all authentication controls.
  remediation: |
    Rotate the JWT signing secret immediately. Store the secret in environment
    variables or a secrets manager. Consider migrating to asymmetric signing
    (RS256) where only the private key needs protection.
  references:
    - "https://cwe.mitre.org/data/definitions/345.html"
    - "https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/"
  compliance_refs:
    - "PCI-DSS 6.2.4"
  steps:
    - "Extract the JWT secret from the source code."
    - "Capture a valid JWT from the application (login, cookie, header)."
    - "Decode the JWT and modify claims (e.g., change user_id to admin)."
    - "Re-sign the modified JWT using the extracted secret."
    - "Submit the forged token and verify elevated access."

- id: hardcoded-database-credentials
  title: "Hardcoded Database Credentials"
  severity: HIGH
  cvss_score: 8.2
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 798
  owasp_id: "A07:2025"
  attack_ids: ["T1552.001"]
  attack_tactics: ["Credential Access"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: ["mysql-connection-string", "postgres-connection-string", "mongodb-connection-string"]
    trufflehog_detector: ["MySQL", "Postgres", "MongoDB"]
    bandit_test: []
    cwe: [798]
  description: |
    Database connection credentials (username, password, connection string)
    were found hardcoded in source code or configuration files.
  impact: |
    An attacker can connect directly to the database and read, modify, or
    delete data. This may include user credentials, PII, financial records,
    and application configuration.
  remediation: |
    Rotate database credentials immediately. Use environment variables or a
    secrets manager for connection configuration. Restrict database network
    access to only application servers.
  references:
    - "https://cwe.mitre.org/data/definitions/798.html"
  compliance_refs:
    - "PCI-DSS 6.2.4"
    - "HIPAA §164.312(a)(1)"
  steps:
    - "Extract the connection string or credentials from the source code."
    - "Attempt to connect to the database from the assessment host."
    - "If direct access is blocked, test via SSRF or from a compromised host."
    - "Enumerate databases, tables, and sample sensitive data."
    - "Document the credentials, database type, and data accessible."

- id: exposed-cloud-credentials
  title: "Exposed Cloud Credentials"
  severity: CRITICAL
  cvss_score: 9.3
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H"
  cvss_version: "4.0"
  cwe_id: 798
  owasp_id: "A07:2025"
  attack_ids: ["T1552.001"]
  attack_tactics: ["Credential Access"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: ["aws-secret-access-key", "azure-storage-key", "gcp-service-account"]
    trufflehog_detector: ["AWS", "Azure", "GCP"]
    bandit_test: []
    cwe: [798]
  description: |
    Cloud provider credentials (AWS access keys, Azure storage keys, GCP
    service account keys) were found in source code or configuration files.
  impact: |
    An attacker can access the cloud environment with the permissions
    associated with the exposed credentials, potentially reading/modifying
    data, launching infrastructure, or escalating to administrative access.
  remediation: |
    Revoke and rotate the exposed credentials immediately. Use IAM roles
    and instance profiles instead of long-lived credentials. Enable
    CloudTrail/audit logging to detect unauthorized access.
  references:
    - "https://cwe.mitre.org/data/definitions/798.html"
  compliance_refs:
    - "PCI-DSS 6.2.4"
    - "ISO27001 A.9.2.4"
  steps:
    - "Extract the cloud credentials from the source code."
    - "Enumerate accessible resources: aws sts get-caller-identity, aws s3 ls."
    - "Check for privilege escalation paths (IAM policy analysis)."
    - "Document the credential type, provider, permissions, and resources accessible."

- id: debug-endpoint-exposed
  title: "Debug Endpoint Exposed in Production"
  severity: HIGH
  cvss_score: 7.7
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 489
  owasp_id: "A05:2025"
  attack_ids: ["T1190"]
  attack_tactics: ["Initial Access"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: []
    trufflehog_detector: []
    bandit_test: ["B201"]
    cwe: [489]
  description: |
    Source code analysis identified debug or diagnostic endpoints that may
    be accessible in production (Flask debug mode, Django debug toolbar,
    Spring Actuator endpoints without auth).
  impact: |
    Debug endpoints can expose internal application state, stack traces,
    environment variables, database queries, and in some cases enable
    code execution (Werkzeug debugger).
  remediation: |
    Ensure DEBUG=False in production. Remove or restrict debug endpoints
    behind authentication. Use environment-specific configuration to
    prevent debug features from reaching production.
  references:
    - "https://cwe.mitre.org/data/definitions/489.html"
  compliance_refs:
    - "PCI-DSS 6.2.4"
  steps:
    - "Identify the debug endpoint from the source code (e.g., /debug, /__debug__, /actuator)."
    - "Access the endpoint on the production URL."
    - "If accessible, document exposed information (env vars, stack traces, SQL queries)."
    - "For Werkzeug debugger: attempt to execute code via the interactive console."
    - "Document the endpoint, information disclosed, and exploitation potential."

- id: development-artifact-in-production
  title: "Development Artifact in Production"
  severity: MEDIUM
  cvss_score: 5.1
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 489
  owasp_id: "A05:2025"
  attack_ids: ["T1083"]
  attack_tactics: ["Discovery"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: []
    trufflehog_detector: []
    bandit_test: []
    cwe: [489]
  description: |
    Development or test artifacts were found that may be accessible in
    production, such as test accounts, sample data, TODO comments with
    security implications, or disabled security checks.
  impact: |
    Development artifacts can provide attackers with information about
    the application's internals, test credentials, or disabled security
    features that can be leveraged for further attacks.
  remediation: |
    Remove all development artifacts before deploying to production.
    Implement a pre-deployment checklist that includes artifact removal.
    Use separate configuration for development and production.
  references:
    - "https://cwe.mitre.org/data/definitions/489.html"
  compliance_refs: []
  steps:
    - "Identify the development artifact from the source code reference."
    - "Determine if the artifact is accessible in the production environment."
    - "If test credentials exist, attempt to use them for authentication."
    - "If security checks are disabled, test the unprotected functionality."
    - "Document the artifact type, location, and potential exploitation."

- id: exposed-configuration-file
  title: "Sensitive Configuration File Exposed"
  severity: HIGH
  cvss_score: 7.7
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 538
  owasp_id: "A05:2025"
  attack_ids: ["T1083"]
  attack_tactics: ["Discovery"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: ["env-file"]
    trufflehog_detector: []
    bandit_test: []
    cwe: [538]
  description: |
    A sensitive configuration file (.env, settings.py, application.yml)
    containing credentials or secrets was found in version control or
    a publicly accessible location.
  impact: |
    An attacker can extract database credentials, API keys, signing secrets,
    and other sensitive configuration that enables further attacks on backend
    systems.
  remediation: |
    Remove the configuration file from version control history using
    git filter-branch or BFG Repo-Cleaner. Add the file to .gitignore.
    Rotate all credentials contained in the exposed file.
  references:
    - "https://cwe.mitre.org/data/definitions/538.html"
  compliance_refs:
    - "PCI-DSS 6.2.4"
  steps:
    - "Access the configuration file (e.g., /.env, /config/settings.py)."
    - "Extract credentials and secrets from the file contents."
    - "Test each discovered credential against its corresponding service."
    - "Document the file location, credentials found, and access obtained."

- id: default-credentials-in-config
  title: "Default Credentials in Configuration"
  severity: HIGH
  cvss_score: 8.2
  cvss_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N"
  cvss_version: "4.0"
  cwe_id: 798
  owasp_id: "A07:2025"
  attack_ids: ["T1078.001"]
  attack_tactics: ["Persistence"]
  aliases:
    nessus_plugin: []
    cve: []
    gitleaks_rule: []
    trufflehog_detector: []
    bandit_test: []
    cwe: [798]
  description: |
    Configuration files contain default or example credentials that have
    not been changed from their initial values (admin/admin, root/password,
    etc.).
  impact: |
    An attacker can authenticate using the default credentials to gain
    privileged access to the application or supporting infrastructure.
  remediation: |
    Replace all default credentials with strong, unique values during
    deployment. Implement first-run setup that forces credential changes.
    Use a secrets manager to generate and store credentials.
  references:
    - "https://cwe.mitre.org/data/definitions/798.html"
  compliance_refs:
    - "PCI-DSS 2.1"
    - "ISO27001 A.9.2.4"
  steps:
    - "Identify default credentials from the configuration file."
    - "Locate the login endpoint for the corresponding service."
    - "Attempt authentication with the default credentials."
    - "If successful, document the access level obtained."
    - "Check for credential reuse across multiple services."
